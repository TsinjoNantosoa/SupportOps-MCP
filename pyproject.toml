[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "supportops-mcp-ai-copilot"
version = "0.2.2"
description = "Hybrid n8n, OpenAI, and MCP IT helpdesk automation platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp[cli]>=2.0,<3",
  "openai-agents>=0.6,<1",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
  "starlette>=0.41,<2",
]

[project.scripts]
supportops = "supportops.cli:app"
supportops-ticketing = "supportops.servers.ticketing_server:main"
supportops-knowledge = "supportops.servers.knowledge_server:main"
supportops-approval-api = "supportops.approval_api:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/supportops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
